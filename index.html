<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASE Job Fair | Live Google Sheets Attendance Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0E5774;     
            --secondary-teal: #13A8B4;   
            --dark-navy: #063B52;        
            --bg-cyan: #F4FBFC;  
            --white: #FFFFFF;            
            --text-main: #1E293B;
            --text-muted: #64748B;
            --success-color: #059669;
            --success-bg: #ECFDF5;
            --warning-color: #D97706;
            --warning-bg: #FFFBEB;
            --danger-color: #DC2626;
            --danger-bg: #FEF2F2;
            --border-color: #E2E8F0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cyan);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .portal-wrapper { width: 100%; max-width: 480px; }

        .card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(14, 87, 116, 0.08);
            border: 1px solid var(--border-color);
            padding: 35px;
            text-align: center;
        }

        .card h1 { color: var(--primary-blue); margin: 0 0 5px 0; font-size: 22px; font-weight: 800; }
        .card p { color: var(--text-muted); font-size: 13.5px; margin-bottom: 25px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--primary-blue); margin-bottom: 6px; }

        .form-control {
            width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--secondary-teal); }
        .code-input { font-family: monospace; font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-align: center; }

        .btn-primary {
            width: 100%; background: var(--primary-blue); color: var(--white); border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 5px;
        }
        .btn-primary:hover { background: var(--dark-navy); }

        .alert-box {
            margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; text-align: left; line-height: 1.4;
        }
        .alert-box.success { background: var(--success-bg); color: var(--success-color); border: 1px solid rgba(5, 150, 105, 0.2); display: block; }
        .alert-box.warning { background: var(--warning-bg); color: var(--warning-color); border: 1px solid rgba(217, 119, 6, 0.2); display: block; }
        .alert-box.error { background: var(--danger-bg); color: var(--danger-color); border: 1px solid rgba(220, 38, 38, 0.2); display: block; }

        .footer-actions { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .link-btn { background: none; border: none; color: var(--primary-blue); font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }
        .link-btn:hover { color: var(--secondary-teal); }

        .hidden { display: none !important; }

        /* Modals */
        .admin-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100;
        }
        .admin-card { background: var(--white); width: 100%; max-width: 800px; max-height: 90vh; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .admin-header { padding: 20px 25px; background: var(--primary-blue); color: var(--white); display: flex; justify-content: space-between; align-items: center; }
        .admin-header h2 { margin: 0; font-size: 18px; }
        .btn-close { background: none; border: none; color: var(--white); font-size: 20px; cursor: pointer; }
        .admin-body { padding: 25px; overflow-y: auto; flex: 1; }

        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border-color); text-align: left; }
        th { background: var(--bg-cyan); color: var(--primary-blue); font-weight: 700; text-transform: uppercase; font-size: 11.5px; }

        .badge-status { padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .badge-status.present { background: var(--success-bg); color: var(--success-color); }
        .badge-status.absent { background: var(--bg-cyan); color: var(--text-muted); }

        .btn-export { background: var(--success-color); color: var(--white); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
        .app-footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="portal-wrapper">
    <div class="card">
        <h1>KASE Job Fair</h1>
        <p>Live Google Sheets Attendance Hub</p>

        <form onsubmit="handleAttendanceSubmit(event)">
            <div class="form-group">
                <label>Enter Candidate Code</label>
                <input type="text" id="scanCodeInput" class="form-control code-input" placeholder="e.g. KH01" autocomplete="off" autofocus required>
            </div>
            <button type="submit" id="submitBtn" class="btn-primary">Mark Attendance</button>
        </form>

        <div id="feedbackAlert" class="alert-box"></div>

        <div class="footer-actions">
            <button class="link-btn" onclick="openSpotModal()" type="button">+ Spot Registration</button>
            <button class="link-btn" onclick="openAdminModal()" type="button">📊 View & Export Data</button>
        </div>
    </div>
    <div class="app-footer">Kerala Academy for Skills Excellence &copy; 2026</div>
</div>

<!-- SPOT REGISTRATION MODAL -->
<div id="spotModal" class="admin-modal hidden">
    <div class="admin-card" style="max-width: 450px;">
        <div class="admin-header">
            <h2>Spot Registration</h2>
            <button class="btn-close" onclick="closeSpotModal()" type="button">&times;</button>
        </div>
        <div class="admin-body">
            <form id="spotForm" onsubmit="handleSpotRegistration(event)">
                <div class="form-group">
                    <label>Assigned Code (e.g. SP01)</label>
                    <input type="text" id="spotCode" class="form-control code-input" placeholder="SP01" required>
                </div>
                <div class="form-group">
                    <label>Candidate Full Name</label>
                    <input type="text" id="spotName" class="form-control" placeholder="Full name" required>
                </div>
                <div class="form-group">
                    <label>Qualification / Trade</label>
                    <input type="text" id="spotQual" class="form-control" placeholder="Trade / Qualification" required>
                </div>
                <button type="submit" id="spotBtn" class="btn-primary">Register & Mark Present</button>
            </form>
        </div>
    </div>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="admin-modal hidden">
    <div class="admin-card">
        <div class="admin-header">
            <h2>Live Google Sheet Records</h2>
            <button class="btn-close" onclick="closeAdminModal()" type="button">&times;</button>
        </div>
        <div class="admin-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <div id="statsText" style="font-size: 14px; font-weight: 600; color: var(--primary-blue);">Loading data from Google Sheet...</div>
                <button class="btn-export" onclick="exportToExcel()" type="button">📥 Export to Excel / CSV</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Code</th><th>Candidate Name</th><th>Qualification</th><th>Status</th><th>Time Recorded</th></tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzJybJzZPv-ZxmxkQfQ4FN3GFxmHTSuKcHJasYP4NvoK4dhHnKxkcm_iXlWNGXWI8U4/exec";
    let candidates = [];
    let localAttendanceCache = JSON.parse(localStorage.getItem('kase_local_cache') || '{}');
    let localSpotRegistrations = JSON.parse(localStorage.getItem('kase_spot_registrations') || '[]');

    function loadSheetData(callback) {
        const callbackName = 'jsonp_cb_' + Math.round(Math.random() * 1000000);
        window[callbackName] = function(data) {
            delete window[callbackName];
            if (scriptTag.parentNode) document.body.removeChild(scriptTag);
            
            let mergedList = [];
            if (data && Array.isArray(data)) {
                mergedList = data;
            }

            // Append any locally added spot registrations if not already in sheet
            localSpotRegistrations.forEach(spot => {
                if (!mergedList.some(c => c.code.toUpperCase() === spot.code.toUpperCase())) {
                    mergedList.push(spot);
                }
            });

            // Apply local attendance cache status overrides
            mergedList.forEach(c => {
                let upperCode = c.code.toUpperCase();
                if (localAttendanceCache[upperCode]) {
                    c.status = "Present";
                    c.time = localAttendanceCache[upperCode].time;
                }
            });

            candidates = mergedList;
            if (callback) callback(candidates);
        };

        const scriptTag = document.createElement('script');
        scriptTag.src = `${WEB_APP_URL}?callback=${callbackName}`;
        scriptTag.onerror = function() {
            delete window[callbackName];
            if (scriptTag.parentNode) document.body.removeChild(scriptTag);
            
            // Fallback to local cache if offline
            let fallbackList = [...localSpotRegistrations];
            fallbackList.forEach(c => {
                let upperCode = c.code.toUpperCase();
                if (localAttendanceCache[upperCode]) {
                    c.status = "Present";
                    c.time = localAttendanceCache[upperCode].time;
                }
            });
            candidates = fallbackList;
            if (callback) callback(candidates);
        };
        document.body.appendChild(scriptTag);
    }

    function handleAttendanceSubmit(e) {
        e.preventDefault();
        const inputField = document.getElementById('scanCodeInput');
        const alertBox = document.getElementById('feedbackAlert');
        const btn = document.getElementById('submitBtn');
        
        let rawCode = inputField.value.trim().toUpperCase().replace(/\s+/g, '');
        btn.innerText = "Checking...";

        loadSheetData(function(data) {
            let candidate = candidates.find(c => c.code.toUpperCase() === rawCode);

            if (!candidate) {
                btn.innerText = "Mark Attendance";
                alertBox.className = "alert-box error";
                alertBox.innerHTML = `⚠️ Error: Code <strong>"${inputField.value}"</strong> not found in Google Sheet!`;
                inputField.value = "";
                inputField.focus();
                return;
            }

            if (candidate.status === "Present") {
                btn.innerText = "Mark Attendance";
                alertBox.className = "alert-box warning";
                alertBox.innerHTML = `⚠️ Notice: <strong>${candidate.name} (${candidate.code})</strong> was already marked present at ${candidate.time}!`;
                inputField.value = "";
                inputField.focus();
            } else {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                candidate.status = "Present";
                candidate.time = timeString;

                localAttendanceCache[candidate.code.toUpperCase()] = { time: timeString };
                localStorage.setItem('kase_local_cache', JSON.stringify(localAttendanceCache));

                btn.innerText = "Syncing...";
                sendPostRequest({ action: "markPresent", code: candidate.code, time: timeString }, function() {
                    btn.innerText = "Mark Attendance";
                    alertBox.className = "alert-box success";
                    alertBox.innerHTML = `✅ Attendance Marked & Synced!<br><strong>${candidate.name} (${candidate.code})</strong>`;
                    inputField.value = "";
                    inputField.focus();
                });
            }
        });
    }

    function openSpotModal() { document.getElementById('spotModal').classList.remove('hidden'); }
    function closeSpotModal() { document.getElementById('spotModal').classList.add('hidden'); }

    function handleSpotRegistration(e) {
        e.preventDefault();
        const code = document.getElementById('spotCode').value.trim().toUpperCase();
        const name = document.getElementById('spotName').value.trim();
        const qual = document.getElementById('spotQual').value.trim();
        const spotBtn = document.getElementById('spotBtn');

        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        spotBtn.innerText = "Registering...";
        
        let newSpot = {
            code: code,
            name: name + " (Spot)",
            qual: qual,
            status: "Present",
            time: timeString
        };

        // Save to local spot list and attendance cache
        localSpotRegistrations.push(newSpot);
        localStorage.setItem('kase_spot_registrations', JSON.stringify(localSpotRegistrations));

        localAttendanceCache[code] = { time: timeString };
        localStorage.setItem('kase_local_cache', JSON.stringify(localAttendanceCache));

        sendPostRequest({ action: "spotRegister", code: code, name: name + " (Spot)", qual: qual, time: timeString }, function() {
            spotBtn.innerText = "Register & Mark Present";
            closeSpotModal();
            document.getElementById('spotForm').reset();

            const alertBox = document.getElementById('feedbackAlert');
            alertBox.className = "alert-box success";
            alertBox.innerHTML = `✅ Spot Registration Synced & Added!<br>Code: <strong>${code} - ${name}</strong>`;
            document.getElementById('scanCodeInput').focus();
        });
    }

    function sendPostRequest(payload, callback) {
        const iframeName = 'hidden_iframe_' + Date.now();
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEB_APP_URL;
        form.target = iframeName;

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'postData';
        input.value = JSON.stringify(payload);
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();

        setTimeout(function() {
            document.body.removeChild(form);
            document.body.removeChild(iframe);
            if (callback) callback();
        }, 1200);
    }

    function openAdminModal() {
        const statsText = document.getElementById('statsText');
        statsText.innerText = "Fetching records from Google Sheet...";
        document.getElementById('adminModal').classList.remove('hidden');

        loadSheetData(function(data) {
            if (data) {
                renderAdminTable();
            } else {
                statsText.innerText = "Error loading records from Google Sheet.";
            }
        });
    }

    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

    function renderAdminTable() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = "";
        let presentCount = 0;

        candidates.forEach(c => {
            if (c.status === "Present") presentCount++;
            const tr = document.createElement('tr');
            const isPresent = c.status === "Present";
            
            tr.innerHTML = `
                <td><code style="font-weight:bold; color:var(--primary-blue);">${c.code}</code></td>
                <td><strong>${c.name}</strong></td>
                <td>${c.qual}</td>
                <td><span class="badge-status ${isPresent ? 'present' : 'absent'}">${c.status}</span></td>
                <td style="color:var(--text-muted);">${c.time}</td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('statsText').innerText = `Present: ${presentCount} / Total Registry: ${candidates.length}`;
    }

    function exportToExcel() {
        let csvContent = "data:text/csv;charset=utf-8,Candidate Code,Candidate Name,Qualification,Attendance Status,Time Recorded\r\n";
        candidates.forEach(c => {
            let row = [c.code, `"${c.name}"`, `"${c.qual}"`, c.status, c.time];
            csvContent += row.join(",") + "\r\n";
        });
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "KASE_Job_Fair_Live_Attendance.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
